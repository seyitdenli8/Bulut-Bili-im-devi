<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ogrenci Web Uygulamasi</title>
  <style>
    :root {
      --bg: #f2f5f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #0ea5e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(160deg, #eaf2ff, #f7fbff 45%, #f1f5f9);
      color: var(--text);
    }

    main {
      width: min(92vw, 680px);
      background: var(--card);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      border: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.4rem, 2.2vw + 1rem, 2rem);
      color: #0f172a;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .info {
      margin-top: 14px;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: #075985;
      font-weight: 600;
    }

    .info strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Bulut Bilişim Ödevi</h1>
   
    <div class="info">
      Ad Soyad: <strong>Seyit Ahmet Denli</strong><br />
      Ogrenci No: <strong>221002043</strong>
    </div>
  </main>
</body>
</html>
